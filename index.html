<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#18745b" />
    <meta name="description" content="Journal alimentaire, recettes, stock et courses." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./recipe.css" />
    <title>Repas & stock</title>
  </head>
  <body>
    <main id="app" aria-live="polite"></main>
    <style>
      .tracked-product { border-top: 1px solid #edf3ee; padding: 12px 0; }
      .tracked-product .product-pick { display: flex; align-items: center; gap: 8px; }
      .tracked-product .product-pick input { width: 18px; height: 18px; min-width: 18px; padding: 0; margin: 0; accent-color: #18745b; }
      .tracked-product .product-pick span { min-width: 0; }
      .tracked-product .product-pick b { display: block; margin-bottom: 4px; font-size: .94rem; }
      .tracked-product .product-pick small { display: block; color: #62776d; font-size: .78rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tracked-product .product-toggle { display: block; width: auto; margin: 8px 0 0 auto; padding: 6px 9px; font-size: .72rem; }
      .tracked-product .price-details { padding-top: 8px; }
      .product-category { margin: 18px 0; }
      .product-category summary { padding: 8px 0; color: #18745b; font-size: .83rem; font-weight: 700; border-bottom: 1px solid #dcebe0; cursor: pointer; }
      .product-category summary small { color: #62776d; margin-left: 5px; }
      .price-chart-wrap { margin: 10px 0; padding: 9px; border: 1px solid #dcebe0; border-radius: 12px; background: #f8fcf9; }
      .price-chart { display: block; width: 100%; height: 128px; }
      .price-chart line { stroke: #d8e8dc; stroke-width: 1; }
      .price-chart text { fill: #597169; font-size: 11px; }
      .price-chart polyline { fill: none; stroke: #19805f; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
      .price-chart circle { fill: #fff; stroke: #19805f; stroke-width: 3; }
      .shopping-summary { margin-top: 22px; padding-top: 16px; border-top: 2px solid #dcebe0; }
      .shopping-summary h3 { margin: 0 0 10px; }
      .shopping-summary article { display: grid; grid-template-columns: 1fr 92px auto; align-items: end; gap: 9px; padding: 10px 0; border-top: 1px solid #edf3ee; }
      .shopping-summary article small { display: block; margin-top: 3px; color: #62776d; font-size: .7rem; }
      .shopping-summary label { color: #597169; font-size: .68rem; }
      .shopping-summary input { padding: 7px; margin-top: 3px; }
      .shopping-summary strong { padding-bottom: 8px; font-size: .85rem; white-space: nowrap; }
      .cart-total { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-top: 12px; padding: 11px 0; border-top: 1px solid #dcebe0; }
      .cart-total strong { padding: 0; font-size: 1rem; }
      .cart-macros { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
      .cart-macros span { padding: 5px 8px; border-radius: 99px; background: #eef6f0; color: #18745b; font-size: .72rem; font-weight: 700; }
    </style>
    <script type="module" src="./src/main.js?v=20260919-36"></script>
  </body>
</html>
